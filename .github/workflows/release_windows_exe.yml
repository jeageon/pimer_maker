name: Release Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.12.0
        shell: pwsh

      - name: Build PrimerMaker.exe
        shell: pwsh
        run: |
          if (!(Test-Path resources)) {
            New-Item -ItemType Directory -Path resources | Out-Null
          }
          if (!(Test-Path resources\\primer_maker.ico)) {
            Add-Type -AssemblyName System.Drawing
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon([System.IO.Path]::Combine($env:WINDIR, 'System32', 'imageres.dll'))
            $stream = New-Object System.IO.FileStream('resources\\primer_maker.ico',[System.IO.FileMode]::Create)
            $icon.Save($stream)
            $stream.Close()
          }

          pyinstaller --noconfirm --onefile --name PrimerMaker --windowed --collect-all streamlit --icon resources\\primer_maker.ico src\\webui.py

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\\pimer_maker_release\\source | Out-Null

          Copy-Item -Path dist\\PrimerMaker.exe -Destination release\\pimer_maker_release\\PrimerMaker.exe -Force
          Copy-Item -Path resources\\primer_maker.ico -Destination release\\pimer_maker_release\\PrimerMaker.ico -Force
          Copy-Item -Path README.md -Destination release\\pimer_maker_release\\source -Force
          Copy-Item -Path requirements.txt -Destination release\\pimer_maker_release\\source -Force
          Copy-Item -Recurse -Path src,scripts,tests,data -Destination release\\pimer_maker_release\\source -Force
          Compress-Archive -Path release\\pimer_maker_release\\* -DestinationPath release\\pimer_maker_release.zip -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/pimer_maker_release/PrimerMaker.exe
            release/pimer_maker_release.zip
          generate_release_notes: true
